[package]
name = "dyauthreply"
version = "0.1.28"
description = "DyAuthReply Desktop Client"
authors = ["DyAuthReply"]
edition = "2021"

[lib]
name = "dyauthreply_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-opener = "2"
tauri-plugin-autostart = "2"
# 应用内更新（镜像竞速探测用 reqwest，端点用 url，竞速并发用 futures）
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
url = "2"
futures = "0.3"
tokio = { version = "1", features = ["net", "sync", "time", "macros"] }
tokio-tungstenite = { version = "0.29", default-features = false, features = ["connect", "handshake"] }
directories = "6"
uuid = { version = "1", features = ["serde", "v4"] }
sha2 = "0.10"
hmac = "0.12"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
