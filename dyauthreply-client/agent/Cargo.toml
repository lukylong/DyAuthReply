[package]
name = "dy-agent"
default-run = "dy-agent"
version = "0.1.0"
edition = "2021"
description = "Event-driven local runtime for DyAuthReply"
license = "Apache-2.0"
publish = false

[lib]
name = "dy_agent"
path = "src/lib.rs"

[[bin]]
name = "dy-agent"
path = "src/main.rs"

[dependencies]
fancy-regex = "=0.19.0"
regex = "1.12"
chrono = { version = "0.4", default-features = false, features = ["std"] }
chrono-tz = "0.10"
ed25519-dalek = { version = "2.2", features = ["pkcs8", "pem"] }
aes = "0.8"
cbc = { version = "0.1", features = ["alloc", "block-padding"] }
rsa = "0.9"
rand = "0.8"
base64 = "0.22"
rquickjs = "=0.9.0"
p256 = { version = "0.13", features = ["ecdh", "ecdsa", "pem"] }
hkdf = "0.12"
hmac = "0.12"
x509-cert = { version = "0.2", features = ["pem"] }
wreq = { version = "=6.0.0-rc.31", features = ["stream", "ws", "multipart"] }
futures-util = { version = "0.3", default-features = false, features = ["std", "sink"] }
md-5 = "0.10"
flate2 = "1"
wreq-util = "=3.0.0-rc.14"
anyhow = "1"
axum = { version = "0.8", features = ["ws"] }
directories = "6"
fs2 = "0.4"
rusqlite = { version = "0.37", features = ["backup", "bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["arbitrary_precision"] }
sha2 = "0.10"
subtle = "2"
thiserror = "2"
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-tungstenite = { version = "0.29", default-features = false, features = ["connect", "handshake"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
uuid = { version = "1", features = ["serde", "v4"] }
zstd = "0.13"
sysinfo = { version = "=0.37.2", default-features = false, features = ["system"] }
zip = { version = "=7.2.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[dev-dependencies]
http-body-util = "0.1"
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
tokio = { version = "1", features = ["test-util", "io-util"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
pedantic = "warn"
