[package]
name = "dy-agent"
version = "0.1.0"
edition = "2021"
description = "Event-driven local runtime for DyAuthReply"
license = "Apache-2.0"
publish = false

[lib]
name = "dy_agent"
path = "src/lib.rs"

[[bin]]
name = "dy-agent"
path = "src/main.rs"

[dependencies]
anyhow = "1"
axum = "0.8"
directories = "6"
fs2 = "0.4"
rusqlite = { version = "0.37", features = ["backup", "bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["arbitrary_precision"] }
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
uuid = { version = "1", features = ["serde", "v4"] }
zstd = "0.13"

[dev-dependencies]
http-body-util = "0.1"
tempfile = "3"
tower = { version = "0.5", features = ["util"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
pedantic = "warn"
