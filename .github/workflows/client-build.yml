name: Build Client

on:
  push:
    tags:
      - 'client-v*'
  pull_request:
    paths:
      - 'dyauthreply-client/**'
      - 'backend-django/**'
      - 'protocol-fixtures/**'
      - 'launcher.spec'
      - 'scripts/client/**'
      - '.github/workflows/client-build.yml'
  workflow_dispatch:

concurrency:
  group: client-build-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: '3.11'
  NODE_VERSION: '20'
  PYTHONUTF8: '1'
  CLIENT_LICENSE_SERVER_URL: 'https://pro.zhenyangtang.com.cn'
  LICENSE_LEASE_PUBLIC_KEY_B64: ${{ secrets.LICENSE_LEASE_PUBLIC_KEY_B64 }}
  # 公开下载/更新托管仓（latest.json 变体 + 签名包发布到其 client-latest Release）
  DIST_REPO: lukylong/DyAuthReply-dist
  # 应用内更新镜像清单（镜像在前、GitHub 原站兜底）。必须与客户端默认/Rust slug 规则一致。
  UPDATE_MIRRORS: 'https://ghproxy.net/,https://gh-proxy.com/,https://ghfast.top/,https://github.com/'

jobs:
  release-preflight:
    name: Release identity and publication preflight
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Verify stable overwrite identity and synchronized version
        shell: bash
        run: |
          set -euo pipefail
          args=()
          if [[ "$GITHUB_REF" == refs/tags/client-v* ]]; then
            args+=(--tag "$GITHUB_REF_NAME")
          fi
          node scripts/client/check_release_contract.mjs "${args[@]}"

      - name: Require every release credential
        if: startsWith(github.ref, 'refs/tags/client-v')
        shell: bash
        env:
          LEASE_KEY: ${{ secrets.LICENSE_LEASE_PUBLIC_KEY_B64 }}
          UPDATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          DIST_TOKEN: ${{ secrets.DIST_REPO_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$LEASE_KEY"
          test -n "$UPDATE_KEY"
          test -n "$DIST_TOKEN"
          echo 'RELEASE_CREDENTIALS_PRESENT=1'

      - name: Prepare draft and rolling releases
        if: startsWith(github.ref, 'refs/tags/client-v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          DIST_TOKEN: ${{ secrets.DIST_REPO_TOKEN }}
        run: |
          set -euo pipefail
          if ! gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft \
              --title "DyAuthReply Client $GITHUB_REF_NAME" \
              --notes-file .github/client-release-notes.md
          fi
          if ! GH_TOKEN="$DIST_TOKEN" gh release view client-latest --repo "$DIST_REPO" >/dev/null 2>&1; then
            GH_TOKEN="$DIST_TOKEN" gh release create client-latest --repo "$DIST_REPO" --latest \
              --title "D助手 客户端与插件下载" \
              --notes "安装包随新版本滚动更新，本 Release 始终为最新版。"
          fi

  agent-quality:
    name: Rust Agent quality gate
    needs: release-preflight
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install native transport build prerequisites
        run: sudo apt-get update && sudo apt-get install -y cmake clang libclang-dev pkg-config

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt

      - name: Setup Python protocol verifier
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install protocol verifier dependency
        run: >-
          python -m pip install
          'Django==5.2.7'
          'protobuf>=5.27.1,<6'
          'cryptography>=42.0.5,<45'

      - name: Cache Rust Agent dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: dyauthreply-client/agent

      - name: Check formatting
        run: cargo fmt --manifest-path dyauthreply-client/agent/Cargo.toml -- --check

      - name: Run Clippy
        run: cargo clippy --locked --manifest-path dyauthreply-client/agent/Cargo.toml --all-targets -- -D warnings

      - name: Run tests
        run: cargo test --locked --manifest-path dyauthreply-client/agent/Cargo.toml

      - name: Run deterministic 10/100/300 account simulations
        shell: bash
        run: |
          set -euo pipefail
          cargo run --release --locked --manifest-path dyauthreply-client/agent/Cargo.toml --bin runtime-sim -- --accounts 10 --events-per-account 100
          cargo run --release --locked --manifest-path dyauthreply-client/agent/Cargo.toml --bin runtime-sim -- --accounts 100 --events-per-account 2
          cargo run --release --locked --manifest-path dyauthreply-client/agent/Cargo.toml --bin runtime-sim -- --accounts 300 --events-per-account 1

      - name: Run real runtime memory CPU and hard-cap soak gates
        shell: bash
        run: |
          set -euo pipefail
          common=(--max-rss-mib 512 --max-growth-mib 128 --max-tail-growth-mib 32 --max-cpu-cores 8 --max-drain-ms 10000 --max-backpressure-per-event 100 --max-thread-growth 0)
          cargo run --release --locked --manifest-path dyauthreply-client/agent/Cargo.toml --bin runtime-soak -- \
            --accounts 300 --cycles 20 --events-per-account 50 --producers 128 "${common[@]}"
          cargo run --release --locked --manifest-path dyauthreply-client/agent/Cargo.toml --bin runtime-soak -- \
            --accounts 512 --cycles 5 --events-per-account 20 --producers 256 "${common[@]}"

      - name: Verify shared Python protocol corpus
        env:
          PYTHONPATH: backend-django
        run: >-
          python -m unittest -q
          core.tests.test_douyin_wire_codec
          core.tests.test_douyin_protocol_corpus
          core.tests.test_douyin_http_request_plan_corpus

      - name: Verify embedded Rust protocol corpus
        run: >-
          cargo run --release --locked
          --manifest-path dyauthreply-client/agent/Cargo.toml
          -- --verify-protocol

  build:
    name: Build (${{ matrix.platform_label }})
    needs: [release-preflight, agent-quality]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform_label: macOS Apple Silicon
            rust_target: aarch64-apple-darwin
            artifact_name: dyauthreply-macos-aarch64
            bundle: app,dmg
          - os: windows-latest
            platform_label: Windows x64
            rust_target: x86_64-pc-windows-msvc
            artifact_name: dyauthreply-windows-x64
            bundle: nsis

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            dyauthreply-client/client-ui/package-lock.json
            dyauthreply-client/desktop/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Add Rust cross-compilation target
        run: rustup target add ${{ matrix.rust_target }}

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: dyauthreply-client/desktop/src-tauri

      - name: Install native transport build prerequisites (macOS)
        if: runner.os == 'macOS'
        run: brew list cmake >/dev/null 2>&1 || brew install cmake

      - name: Install native transport build prerequisites (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: choco install nasm llvm -y --no-progress

      - name: Build native Rust Agent
        shell: bash
        run: node scripts/client/build_agent.mjs --profile release --target "${{ matrix.rust_target }}"

      - name: Install npm dependencies
        shell: bash
        run: |
          npm ci --prefix dyauthreply-client/client-ui
          npm ci --prefix dyauthreply-client/desktop

      # 去掉 GitHub Secret 常见的尾随换行/空格，写回 GITHUB_ENV 供 tauri build 签名
      - name: Prepare minisign private key
        shell: bash
        env:
          RAW_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          cleaned="$(printf '%s' "$RAW_KEY" | tr -d '\r\n')"
          echo "TAURI_SIGNING_PRIVATE_KEY=$cleaned" >> "$GITHUB_ENV"

      - name: Build Tauri desktop app
        working-directory: dyauthreply-client/desktop
        env:
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          DY_AGENT_BUILD_PROFILE: release
          DY_AGENT_BUILD_TARGET: ${{ matrix.rust_target }}
        run: npm run tauri build -- --target ${{ matrix.rust_target }} --bundles ${{ matrix.bundle }}

      - name: Audit native release sidecar
        shell: bash
        run: |
          set -euo pipefail
          args=(--target "${{ matrix.rust_target }}")
          if [[ "$GITHUB_REF" == refs/tags/client-v* ]]; then
            args+=(--tag "$GITHUB_REF_NAME")
          fi
          node scripts/client/check_release_contract.mjs "${args[@]}"

      - name: Audit final macOS application bundle
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          app=$(find "dyauthreply-client/desktop/src-tauri/target/${{ matrix.rust_target }}/release/bundle/macos" -maxdepth 1 -name '*.app' -type d -print -quit)
          test -n "$app"
          dyauthreply-client/desktop/verify-bundle.sh "$app"

      - name: Smoke install final Windows NSIS package
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $bundle = "dyauthreply-client/desktop/src-tauri/target/${{ matrix.rust_target }}/release/bundle/nsis"
          $installer = Get-ChildItem $bundle -Filter '*-setup.exe' | Select-Object -First 1
          if (-not $installer) { throw 'Windows installer missing' }
          $installDir = Join-Path $env:RUNNER_TEMP 'dyauthreply-native-install'
          New-Item -ItemType Directory -Force -Path $installDir | Out-Null
          $legacyPath = Join-Path $installDir 'launcher.exe'
          Copy-Item (Join-Path $env:WINDIR 'System32/cmd.exe') $legacyPath
          $legacy = Start-Process -FilePath $legacyPath -ArgumentList @('/c', 'ping -t 127.0.0.1') -PassThru
          Start-Sleep -Milliseconds 500
          $process = Start-Process -FilePath $installer.FullName -ArgumentList @('/S', "/D=$installDir") -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "NSIS install failed: $($process.ExitCode)" }
          if (Get-Process -Id $legacy.Id -ErrorAction SilentlyContinue) { throw 'Legacy launcher survived preinstall hook' }
          Remove-Item $legacyPath -Force -ErrorAction SilentlyContinue
          node scripts/client/audit_native_bundle.mjs "$installDir"
          if (-not (Test-Path (Join-Path $installDir 'dyauthreply.exe'))) { throw 'Desktop executable missing' }
          $uninstaller = Get-ChildItem $installDir -Filter 'uninstall.exe' | Select-Object -First 1
          if ($uninstaller) {
            $uninstall = Start-Process -FilePath $uninstaller.FullName -ArgumentList '/S' -Wait -PassThru
            if ($uninstall.ExitCode -ne 0) { throw "NSIS uninstall failed: $($uninstall.ExitCode)" }
          }
          Write-Output 'WINDOWS_NSIS_SMOKE_PASS=1'

      - name: Collect installer files only
        shell: bash
        run: |
          mkdir -p dist-installers
          shopt -s nullglob
          found=0
          bundle_root="dyauthreply-client/desktop/src-tauri/target/${{ matrix.rust_target }}/release/bundle"
          if [ "${{ runner.os }}" = "macOS" ]; then
            # dmg 安装包 + macOS updater 产物（.app.tar.gz）及其签名
            patterns=("$bundle_root/dmg/*.dmg" "$bundle_root/macos/*.app.tar.gz" "$bundle_root/macos/*.app.tar.gz.sig")
          else
            # NSIS 安装包（同时作为 Windows updater 产物）及其签名
            patterns=("$bundle_root/nsis/*-setup.exe" "$bundle_root/nsis/*-setup.exe.sig")
          fi
          for pattern in "${patterns[@]}"; do
            for f in $pattern; do
              cp "$f" dist-installers/
              found=1
              echo "Collected: $(basename "$f")"
            done
          done
          if [ "$found" -eq 0 ]; then
            echo "No installer found under $bundle_root"
            exit 1
          fi
          if [ "${{ runner.os }}" = "macOS" ]; then
            test "$(find dist-installers -maxdepth 1 -name '*.dmg' | wc -l | tr -d ' ')" = 1
            test "$(find dist-installers -maxdepth 1 -name '*.app.tar.gz' | wc -l | tr -d ' ')" = 1
            test "$(find dist-installers -maxdepth 1 -name '*.app.tar.gz.sig' | wc -l | tr -d ' ')" = 1
          else
            test "$(find dist-installers -maxdepth 1 -name '*-setup.exe' | wc -l | tr -d ' ')" = 1
            test "$(find dist-installers -maxdepth 1 -name '*-setup.exe.sig' | wc -l | tr -d ' ')" = 1
          fi
          ls -la dist-installers/

      # Both matrix jobs upload only to the draft versioned release. The manifest
      # job promotes all platforms together after every build/signature is present.
      - name: Upload signed installers to draft release
        if: startsWith(github.ref, 'refs/tags/client-v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release upload "$GITHUB_REF_NAME" dist-installers/* \
            --repo "$GITHUB_REPOSITORY" --clobber

      # PR / manual runs: keep a short-lived artifact for debugging only.
      - name: Upload installer artifacts
        if: "!startsWith(github.ref, 'refs/tags/client-v')"
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          if-no-files-found: error
          retention-days: 3
          path: dist-installers/*

  # 两个平台构建并把签名包同步到 dist 仓后，统一生成多镜像 latest.json 变体并发布。
  manifest:
    name: Publish updater manifests
    needs: build
    if: startsWith(github.ref, 'refs/tags/client-v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Promote complete signed installer set to public rolling release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          DIST_TOKEN: ${{ secrets.DIST_REPO_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p dist-installers dist-public
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --pattern '*.dmg' --pattern '*.app.tar.gz' --pattern '*.app.tar.gz.sig' \
            --pattern '*-setup.exe' --pattern '*-setup.exe.sig' \
            --dir dist-installers --clobber
          test "$(find dist-installers -maxdepth 1 -name '*.dmg' | wc -l | tr -d ' ')" = 1
          test "$(find dist-installers -maxdepth 1 -name '*.app.tar.gz' | wc -l | tr -d ' ')" = 1
          test "$(find dist-installers -maxdepth 1 -name '*.app.tar.gz.sig' | wc -l | tr -d ' ')" = 1
          test "$(find dist-installers -maxdepth 1 -name '*-setup.exe' | wc -l | tr -d ' ')" = 1
          test "$(find dist-installers -maxdepth 1 -name '*-setup.exe.sig' | wc -l | tr -d ' ')" = 1
          cp "$(find dist-installers -maxdepth 1 -name '*.dmg' -print -quit)" dist-public/DAssistant-macos-aarch64.dmg
          cp "$(find dist-installers -maxdepth 1 -name '*.app.tar.gz' -print -quit)" dist-public/DAssistant-macos-aarch64.app.tar.gz
          cp "$(find dist-installers -maxdepth 1 -name '*.app.tar.gz.sig' -print -quit)" dist-public/DAssistant-macos-aarch64.app.tar.gz.sig
          cp "$(find dist-installers -maxdepth 1 -name '*-setup.exe' -print -quit)" dist-public/DAssistant-windows-x64-setup.exe
          cp "$(find dist-installers -maxdepth 1 -name '*-setup.exe.sig' -print -quit)" dist-public/DAssistant-windows-x64-setup.exe.sig
          GH_TOKEN="$DIST_TOKEN" gh release upload client-latest dist-public/* \
            --repo "$DIST_REPO" --clobber
          echo 'PUBLIC_INSTALLER_SET_COMPLETE=1'

      - name: Package browser extension
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import pathlib
          import zipfile

          source = pathlib.Path("browser-extension/douyin-cred-extractor")
          output = pathlib.Path("dist-extension/douyin-cred-extractor.zip")
          manifest = json.loads((source / "manifest.json").read_text(encoding="utf-8"))
          output.parent.mkdir(parents=True, exist_ok=True)
          with zipfile.ZipFile(output, "w", compression=zipfile.ZIP_DEFLATED) as archive:
              for path in sorted(source.rglob("*")):
                  if path.is_file() and path.name != ".DS_Store":
                      archive.write(path, path.relative_to(source).as_posix())
          with zipfile.ZipFile(output) as archive:
              packaged = json.loads(archive.read("manifest.json"))
              broken = archive.testzip()
          if packaged["version"] != manifest["version"] or broken:
              raise SystemExit(f"Invalid extension archive: version={packaged['version']} broken={broken}")
          print(f"Packaged extension {manifest['version']}: {output}")
          PY

      - name: Attach browser extension to versioned release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release upload "$GITHUB_REF_NAME" dist-extension/douyin-cred-extractor.zip \
            --repo "$GITHUB_REPOSITORY" --clobber

      - name: Sync browser extension to public download repo
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.DIST_REPO_TOKEN }}
          DIST_REPO_TOKEN: ${{ secrets.DIST_REPO_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${DIST_REPO_TOKEN:-}" ]; then
            echo "DIST_REPO_TOKEN 未配置，停止发布"
            exit 1
          fi
          gh release upload client-latest dist-extension/douyin-cred-extractor.zip \
            --repo "$DIST_REPO" --clobber
          echo "已同步 douyin-cred-extractor.zip 到 $DIST_REPO (client-latest)"

      - name: Generate and publish latest.json variants
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.DIST_REPO_TOKEN }}
          DIST_REPO_TOKEN: ${{ secrets.DIST_REPO_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${DIST_REPO_TOKEN:-}" ]; then
            echo "DIST_REPO_TOKEN 未配置，停止发布"
            exit 1
          fi

          version=$(python3 -c "import json;print(json.load(open('dyauthreply-client/desktop/src-tauri/tauri.conf.json'))['version'])")
          pub_date=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          notes="${GITHUB_REF_NAME:-}"

          mkdir -p dist-manifests
          test -s dist-public/DAssistant-windows-x64-setup.exe.sig
          test -s dist-public/DAssistant-macos-aarch64.app.tar.gz.sig

          args=(--version "$version" --pub-date "$pub_date" --notes "$notes"
                --mirrors "$UPDATE_MIRRORS" --out-dir dist-manifests
                --windows-url "https://github.com/$DIST_REPO/releases/latest/download/DAssistant-windows-x64-setup.exe"
                --windows-sig-file dist-public/DAssistant-windows-x64-setup.exe.sig
                --macos-url "https://github.com/$DIST_REPO/releases/latest/download/DAssistant-macos-aarch64.app.tar.gz"
                --macos-sig-file dist-public/DAssistant-macos-aarch64.app.tar.gz.sig)

          python3 scripts/client/gen_update_manifest.py "${args[@]}"

          python3 - <<'PY'
          import json
          from pathlib import Path
          expected = "${{ github.ref_name }}".removeprefix("client-v")
          files = sorted(Path("dist-manifests").glob("latest*.json"))
          if not files:
              raise SystemExit("No updater manifests generated")
          for path in files:
              payload = json.loads(path.read_text())
              if payload.get("version") != expected:
                  raise SystemExit(f"Version mismatch in {path}")
              platforms = payload.get("platforms") or {}
              for name in ("windows-x86_64", "darwin-aarch64"):
                  item = platforms.get(name) or {}
                  if not str(item.get("url") or "").startswith("https://") or not item.get("signature"):
                      raise SystemExit(f"Incomplete {name} in {path}")
          print(f"UPDATER_MANIFESTS_COMPLETE={len(files)}")
          PY

          ls -la dist-manifests/
          gh release upload client-latest dist-manifests/latest*.json --repo "$DIST_REPO" --clobber
          echo "已发布 latest.json 多镜像变体到 $DIST_REPO (client-latest)"

      - name: Publish versioned release after every promotion gate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --draft=false --latest
          echo 'VERSIONED_RELEASE_PUBLISHED=1'
